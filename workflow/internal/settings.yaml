# Module settings that users cannot modify.
resources:
  automatic:
    # Stable Zenodo repository; add a URL containing the {dataset} placeholder.
    url: ""
    datasets:
      - Global_sedmap_1deg.nc
      - temperature_voxel.nc


defaults:
  baseline_scenario: base
  perform_sensitivity: false
  sens_tech: orc

  active_sensitivity_parameters: []
  sensitivity_parameters: {}

  method_region_aggregation: cutoff
  n_quantiles: 4
  fixed_bins:
    - "0-50"
    - "50-100"
    - "100-150"
    - "150-200"
    - "200-250"
  lcoe_cutoff: 75.0

  method_2d_aggregation: LCOE_minimization
  depth_categories:
    - [0, 3000]
    - [3000, 6000]
    - [6000, 10000]

  drilling_cost_curve_definitions:
    thermogis:
      curve_type: quadratic_eur2020
      constant: 250000.0
      linear: 700.0
      quadratic: 0.2
    shamoushaki_2021:
      curve_type: log_quadratic_usd
      a: 5.548e5
      b: 0.2171
      c: 8.135e5
      currency_year: 2021
    getem_2017:
      curve_type: csv_fit_usd
      csv_path: workflow/internal/baseline_drilling_2017.csv
      currency_year: 2017
    getem_2025:
      curve_type: csv_fit_usd
      csv_path: workflow/internal/baseline_drilling_2025.csv
      currency_year: 2025

  carrier_out: power
