$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "file://workflow/internal/config.schema.yaml"
title: "Geothermal module config"
type: object
additionalProperties: false

properties:
  heat_production_temperature:
    type: number
    exclusiveMinimum: 0
  heat_reinjection_temperature:
    type: number
    minimum: 0
  thermal_plant_cost_per_kw:
    type: number
    minimum: 0
  heat_capacity_factor:
    type: number
    exclusiveMinimum: 0
    maximum: 1
  heat_network_buffer_km:
    type: number
    minimum: 0

  include_egs:
    type: boolean
    description: "Whether to include Enhanced Geothermal Systems (EGS)."

  carrier_out:
    type: string
    enum: ["power", "heat", "heat_and_power"]
    description: "Resource alternatives to evaluate; combined mode is not cogeneration."

  max_depth:
    type: number
    minimum: 250
    maximum: 10000
    multipleOf: 250
    description: "Maximum drilling depth (m) considered in the geothermal analysis; must be a multiple of 250 m."

  which_cycles:
    type: array
    description: "Power cycle types to evaluate."
    items:
      type: string
      enum: ["orc", "flash", "kalina"]
    uniqueItems: true

  EGS_cutoff:
    type: number
    minimum: 0
    maximum: 10000
    description: "Depth (m) below which only EGS is assumed."

  SED_NAN_POLICY:
    type: string
    enum: ["depth_only", "always_egs"]
    description: "How to treat NaNs in sediment thickness after resampling."

  temp_turbine_out:
    type: object
    description: "Minimum turbine outlet temperature (°C) per cycle."
    additionalProperties: false
    properties:
      ORC:
        type: number
        minimum: 0
        maximum: 320
      Flash:
        type: number
        minimum: 0
        maximum: 485
      Kalina:
        type: number
        minimum: 0
        maximum: 180

  drilling_cost_curve:
    type: string
    description: "Named drilling cost curve used in the LCOE calculation."

  drilling_cost_curve_definitions:
    type: object
    description: "Definitions for named drilling cost curves."
    additionalProperties:
      type: object
      additionalProperties: true

  stimulation_cost_per_doublet:
    type: number
    minimum: 0
    description: "Stimulation cost per doublet (million €)."

  pump_cost:
    type: number
    minimum: 0
    description: "Pump cost (million €) per pair."

  lifetime:
    type: number
    exclusiveMinimum: 0
    description: "Project lifetime (years)."

  capacity_factor:
    type: number
    minimum: 0
    maximum: 1
    description: "Annual availability factor for electricity generation."

  fixed_OM_rate:
    type: number
    minimum: 0
    maximum: 1
    description: "Fixed O&M rate as fraction of CAPEX per year."

  parasitic_fraction:
    type: number
    minimum: 0
    maximum: 1
    description: "Parasitic fraction of gross power output."

  orc_money_per_kw:
    type: number
    minimum: 0
    description: "ORC specific CAPEX (EUR/kW)."

  flash_money_per_kw:
    type: number
    minimum: 0
    description: "Flash specific CAPEX (EUR/kW)."

  kalina_money_per_kw:
    type: number
    minimum: 0
    description: "Kalina specific CAPEX (EUR/kW)."

  well_spacing:
    type: number
    exclusiveMinimum: 0
    description: "Distance between production and injection well (km)."

  flowrate_egs:
    type: number
    exclusiveMinimum: 0
    description: "Mass flow rate per EGS doublet (kg/s)."

  flowrate_conventional:
    type: number
    exclusiveMinimum: 0
    description: "Mass flow rate per conventional doublet (kg/s)."

  min_dt:
    type: number
    minimum: 0
    description: "Minimum temperature difference between production temperature and turbine outlet temperature for power generation (°C)."

  method_2d_aggregation:
    type: string
    enum: ["LCOE_minimization", "depth_categories"]
    description: "Method to aggregate 3D voxel data to 2D raster."

  method_region_aggregation:
    type: string
    enum: ["quantiles", "fixed_bins", "cutoff"]
    description: "Method to aggregate raster to regions."

  depth_categories:
    type: array
    description: "Depth categories (m) used when method_2d_aggregation=depth_categories."
    minItems: 1
    items:
      type: array
      minItems: 2
      maxItems: 2
      prefixItems:
        - type: number
          minimum: 0
        - type: number
          minimum: 0

  n_quantiles:
    type: integer
    minimum: 1
    description: "Number of quantiles used when method_region_aggregation=quantiles."

  fixed_bins:
    type: array
    description: "Fixed LCOE bins in EUR2020/MWh as strings like '0-50'. Used when method_region_aggregation=fixed_bins."
    minItems: 1
    items:
      type: string
      pattern: "^[0-9]+(\\.[0-9]+)?-[0-9]+(\\.[0-9]+)?$"

  lcoe_cutoff:
    type: number
    minimum: 0
    description: "LCOE cutoff (EUR2020/MWh) used when method_region_aggregation=cutoff."

required:
  - include_egs
  - carrier_out
  - max_depth
  - EGS_cutoff
  - SED_NAN_POLICY
  - drilling_cost_curve
  - stimulation_cost_per_doublet
  - pump_cost
  - lifetime
  - fixed_OM_rate
  - well_spacing
  - flowrate_egs
  - flowrate_conventional

allOf:
  - if:
      properties:
        carrier_out:
          enum: [power, heat_and_power]
    then:
      required: [which_cycles, capacity_factor, parasitic_fraction, orc_money_per_kw, flash_money_per_kw, kalina_money_per_kw, min_dt, method_2d_aggregation, method_region_aggregation]
      allOf:
        - properties:
            which_cycles:
              minItems: 1
          required: ["temp_turbine_out"]

        - if:
            properties:
              which_cycles:
                contains:
                  const: "orc"
          then:
            properties:
              temp_turbine_out:
                required: ["ORC"]

        - if:
            properties:
              which_cycles:
                contains:
                  const: "flash"
          then:
            properties:
              temp_turbine_out:
                required: ["Flash"]

        - if:
            properties:
              which_cycles:
                contains:
                  const: "kalina"
          then:
            properties:
              temp_turbine_out:
                required: ["Kalina"]

        - if:
            properties:
              method_2d_aggregation:
                const: "depth_categories"
          then:
            required: ["depth_categories"]

        - if:
            properties:
              method_region_aggregation:
                const: "quantiles"
          then:
            required: ["n_quantiles"]

        - if:
            properties:
              method_region_aggregation:
                const: "fixed_bins"
          then:
            required: ["fixed_bins"]

        - if:
            properties:
              method_region_aggregation:
                const: "cutoff"
          then:
            required: ["lcoe_cutoff"]
  - if:
      properties:
        carrier_out:
          enum: [heat, heat_and_power]
    then:
      required: [heat_production_temperature, heat_reinjection_temperature, thermal_plant_cost_per_kw, heat_capacity_factor, heat_network_buffer_km]
