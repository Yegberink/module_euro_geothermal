# Module Input-Output structure for automated docs generation
convention_version: v1.0.0

pathvars:
  snakemake_defaults:
    logs:
      default: "<logs>"
      description: Location of rule log files.
    resources:
      default: "<resources>"
      description: Location of module resource files.
    results:
      default: "<results>"
      description: Location of module result files.
  user_resources:
    area_potential:
      default: "<resources>/user/{shapes}/area_potential_geothermal.tif"
      description: Area-potential module output in available square metres per pixel on a square WGS84 grid. Required when eligibility is enabled; resampled once for heat and power.
    shapes:
      default: "<resources>/user/{shapes}/shapes.parquet"
      description: |
        GeoParquet polygons used to crop and aggregate geothermal potential.
        The file must declare a CRS and contain these columns:
        - `shape_id`: unique, non-null identifier for each output region.
        - `geometry`: valid Polygon or MultiPolygon geometry.
        Optional `shape_class` values of `maritime` are excluded from aggregation.
    district_heating:
      default: "<resources>/user/{shapes}/areas.parquet"
      description: |
        Required in heat and combined modes. GeoParquet with a declared CRS:
        - `area_id`: unique, non-null network identifier.
        - `heat_potential_mwh_per_year`: finite, nonnegative connected annual demand.
        - `geometry`: valid Polygon or MultiPolygon geometry.
  results:
    geothermal_regions:
      default: "<results>/{shapes}/geothermal_regions.parquet"
      description: |
        Regional resource alternatives in the input shapes' CRS:
        - `region_id`: string form of the input `shape_id`.
        - `category`: power, heat, or contested resource alternative.
        - `carrier`: power or heat.
        - `technology`: conversion cycle or geothermal_heat.
        - `price_bin`: readable LCOE interval identifier, or all for heat.
        - `bin_left`: lower LCOE bound in EUR2020/MWh; null for cutoff and heat.
        - `bin_right`: upper LCOE bound in EUR2020/MWh; null for heat.
        - `potential`: net electric capacity or annual heat supplied to the consuming region.
        - `potential_unit`: MW_e for power or MWh_th/year for heat.
        - `mean_lcoe`: capacity-weighted EUR2020/MWh electric; null for heat.
        - `mean_lcoh`: supplied-energy-weighted EUR2020/MWh thermal; null for power.
        - `mean_network_distance_m`: supplied-energy-weighted cell-to-network distance in metres; null for power or zero heat supply.
        - `n_cells`: contributing raster-cell count.
        - `geometry`: aggregation-region polygon.
wildcards:
  shapes: Name of the provided shape set.
