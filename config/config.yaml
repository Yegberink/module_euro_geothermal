carrier_out: heat_and_power

eligibility:
  enabled: true

method_region_aggregation: cutoff

n_quantiles: 4

fixed_bins:
  - "0-50"
  - "50-100"
  - "100-150"
  - "150-200"
  - "200-250"

lcoe_cutoff: 75.0

heat_allow_cross_region_supply: true
heat_network_buffer_km: 10.0

which_cycles:
  - orc
  - flash
  - kalina

include_egs: true

drilling_cost_curve: thermogis

discount_rate: 0.075

heat_production_temperature: 80.0
heat_reinjection_temperature: 40.0
thermal_plant_cost_per_kw: 234.0
heat_capacity_factor: 0.88

