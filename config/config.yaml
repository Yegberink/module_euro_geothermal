# =============================================================================
# Geothermal potential & LCOE module — configuration
# =============================================================================
# Quick-start: the only keys you normally need to change are in the first
# section ("Workflow control"). Everything else has sensible
# defaults. Each run uses exactly the configured parameter values.
# Monetary basis: all EUR inputs, cost cutoffs and results use constant 2020
# euros (EUR2020).
# =============================================================================


# -----------------------------------------------------------------------------
# Workflow control
# -----------------------------------------------------------------------------

# Select the output carrier for which to calculate the potential and costs. 
carrier_out: power            # power | heat | heat_and_power

# Toggle for whether to use a supplied area-potential file. 
eligibility:
  enabled: true

method_region_aggregation: cutoff
# options:
#   quantiles    → divide each raster LCOE distribution into n_quantiles classes shared by regions
#   fixed_bins   → user-defined LCOE bins (€2020/MWh) applied uniformly
#   cutoff       → single capacity figure below lcoe_cutoff and average LCOE of that capacity

# For detailed LCOE distributions used in an energy system model, use quantiles or fixed_bins

# Set the value of n_quantiles, fixed_bins, or lcoe_cutoff below depending on the chosen method_region_aggregation
# These settings are only used if the method_region_aggregation is set to the corresponding value.

# quantiles
n_quantiles: 4

# fixed_bins (€2020/MWh)
fixed_bins:
  - "0-50"
  - "50-100"
  - "100-150"
  - "150-200"
  - "200-250"

# cutoff (€2020/MWh)
lcoe_cutoff: 75.0

# -----------------------------------------------------------------------------
# Conversion cycles
# -----------------------------------------------------------------------------
which_cycles:
  - orc
  - flash
  - kalina


# -----------------------------------------------------------------------------
# Reservoir parameters
# -----------------------------------------------------------------------------
max_depth: 6000               # drilling depth (m); multiple of 250 within source range 0–10,000 m

include_egs: true             # true → include Enhanced Geothermal Systems (EGS) locations
EGS_cutoff: 3000.0            # depth below which only EGS is possible (m)

stimulation_cost_per_doublet: 3.0   # EGS stimulation cost per doublet (M€2020)

drilling_cost_curve: thermogis  # thermogis | shamoushaki_2021 | getem_2017 | getem_2025


# -----------------------------------------------------------------------------
# Power plant economics
# -----------------------------------------------------------------------------
# Capital costs per installed capacity
# Manuscript: 38 MW plant; Hackstein & Madlener (2021), Eqs. 14-15,
# https://doi.org/10.1186/s40517-021-00183-2 ; Kalina = ORC x 1.1.
# Rounded values reproduce a USD2019 -> EUR2020 conversion (see config/README.md).
orc_money_per_kw:   1978.0    # ORC plant (€2020/kW)
flash_money_per_kw: 1528.0    # Flash plant (€2020/kW)
kalina_money_per_kw: 2175.0   # Kalina plant (€2020/kW)

pump_cost: 0.6                # pump cost per doublet pair (M€2020)
lifetime: 30.0                # plant lifetime (years)
discount_rate: 0.075          # annual discount rate as a fraction (0.075 = 7.5%); shared by heat and power
capacity_factor: 0.88         # annual availability factor for electricity generation (-)
fixed_OM_rate: 0.015          # fixed O&M as fraction of capital cost per year
parasitic_fraction: 0.21      # parasitic power consumption as fraction of gross output
well_spacing: 1.5             # distance between production and injection well (km)
flowrate_egs: 60.0            # mass flow rate per EGS doublet (kg/s)
flowrate_conventional: 100.0  # mass flow rate per conventional

# Turbine outlet temperatures
temp_turbine_out:
  ORC:   70.0                 # °C
  Flash: 150.0                # °C
  Kalina: 80.0                # °C

# minimum temperature difference between production temp and turbine outlet temp for power generation to be possible (°C)
min_dt: 10.0                  # °C


# -----------------------------------------------------------------------------
# 2-D aggregation
# -----------------------------------------------------------------------------
method_2d_aggregation: LCOE_minimization
# options:
#   LCOE_minimization  → one optimal depth per cell; potential calculated at that depth
#   depth_categories   → separate LCOE/potential rasters per depth band (see below)

# Used only when method_2d_aggregation: depth_categories
depth_categories:
  - [0,    3000]              # 0–3 km
  - [3000, 6000]              # 3–6 km
  - [6000, 10000]             # 6–10 km


# -----------------------------------------------------------------------------
# District heating (heat and heat_and_power modes)
# -----------------------------------------------------------------------------
heat_production_temperature: 80.0  # °C; interpolate the shallowest reachable depth
heat_reinjection_temperature: 40.0 # °C; must be below production temperature
thermal_plant_cost_per_kw: 234.0   # €2020/kWth installed thermal capacity
heat_capacity_factor: 0.88        # annual heat availability; no electric parasitic factor
heat_network_buffer_km: 10.0      # cell centres within this distance of a network polygon
