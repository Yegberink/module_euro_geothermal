# =============================================================================
# Geothermal potential & LCOE module — configuration
# =============================================================================
# Quick-start: the only keys you normally need to change are in the first 
# section ("Workflow control"). Everything else has sensible
# defaults that the sensitivity analysis will vary for you (if you want that).
# =============================================================================


# -----------------------------------------------------------------------------
# Workflow control
# -----------------------------------------------------------------------------
target_shapes:
  - BALK              # folder name(s) under resources/user/

perform_sensitivity: true     # false → only the baseline scenario is run
write_qc_sliders: false        # false → skip depth-slider HTML files (saves disk)

method_region_aggregation: cutoff 
# options:
#   quantiles    → divide LCOE distribution into n_quantiles cost classes per region
#   fixed_bins   → user-defined LCOE bins (€2020/MWh) applied uniformly
#   cutoff       → single capacity figure below lcoe_cutoff and average LCOE of that capacity

# for sensitivity runs cutoff is advised to speed up processing; 
# for detailed LCOE distributions used in an energy system model, use quantiles or fixed_bins

# -----------------------------------------------------------------------------
# Conversion cycles
# -----------------------------------------------------------------------------
which_cycles:
  - orc
  - flash
  - kalina

carrier_out: power            # options: power, heat, both
                              # Note: only 'power' is fully implemented


# -----------------------------------------------------------------------------
# Reservoir parameters
# -----------------------------------------------------------------------------
max_depth: 6000               # maximum drilling depth considered (m); must be a multiple of 250

include_egs: true             # true → include Enhanced Geothermal Systems (EGS) locations
EGS_cutoff: 3000.0            # depth below which only EGS is possible (m)

SED_NAN_POLICY: always_egs    # how to treat missing sediment thickness after resampling:
                              #   always_egs  → treat NaN as 0 m sediment → EGS at all depths
                              #   depth_only  → treat NaN as EGS_cutoff   → EGS only below EGS_cutoff

well_cost_sens: 1.0           # multiplicative scaling factor for well costs (1.0 = no adjustment)
stimulation_cost_per_doublet: 1.03   # EGS stimulation cost per doublet (M€2020)


# -----------------------------------------------------------------------------
# Power plant economics
# -----------------------------------------------------------------------------
# Capital costs per installed capacity
orc_money_per_kw:   1978.0    # ORC plant (€2020/kW)
flash_money_per_kw: 1528.0    # Flash plant (€2020/kW)
kalina_money_per_kw: 2175.0   # Kalina plant (€2020/kW)

pump_cost: 0.6                # pump cost per doublet pair (M€2020)
lifetime: 30.0                # plant lifetime (years)
capacity_factor: 0.88         # annual availability factor for electricity generation (-)
fixed_OM_rate: 0.01           # fixed O&M as fraction of capital cost per year
parasitic_fraction: 0.21      # parasitic power consumption as fraction of gross output
well_spacing: 1.0             # distance between production and injection well (km)
flowrate_egs: 60.0            # mass flow rate per EGS doublet (kg/s)
flowrate_conventional: 100.0  # mass flow rate per conventional

# Turbine outlet temperatures
temp_turbine_out:
  ORC:   70.0                 # °C
  Flash: 150.0                # °C
  Kalina: 80.0                # °C

# minimum temperature difference between production temp and turbine outlet temp for power generation to be possible (°C)
min_dt: 10.0                  # °C


# -----------------------------------------------------------------------------
# 2-D aggregation
# -----------------------------------------------------------------------------
method_2d_aggregation: LCOE_minimization
# options:
#   LCOE_minimization  → one optimal depth per cell; potential calculated at that depth
#   depth_categories   → separate LCOE/potential rasters per depth band (see below)

# Used only when method_2d_aggregation: depth_categories
depth_categories:
  - [0,    3000]              # 0–3 km
  - [3000, 6000]              # 3–6 km
  - [6000, 10000]             # 6–10 km


# -----------------------------------------------------------------------------
# Region aggregation
# -----------------------------------------------------------------------------

# Used only when method_region_aggregation: quantiles
n_quantiles: 4

# Used only when method_region_aggregation: fixed_bins (€2020/MWh)
fixed_bins:
  - "0-50"
  - "50-100"
  - "100-150"
  - "150-200"
  - "200-250"

# Used only when method_region_aggregation: cutoff (€2020/MWh)
lcoe_cutoff: 100.0

# -----------------------------------------------------------------------------
# Sensitivity analysis
# -----------------------------------------------------------------------------

# Technology used as the reference in sensitivity summary plots.
sens_tech: orc                # options: orc, flash, kalina

# Parameters to vary in the sweep.
# Comment out any line to exclude that parameter from the current run.
# Ranges and step counts are defined in `sensitivity_parameters` below.
active_sensitivity_parameters:
  - max_depth
  - EGS_cutoff
  - well_cost_sens
  - stimulation_cost_per_doublet
  - pump_cost
  - lifetime
  - capacity_factor
  - fixed_OM_rate
  - parasitic_fraction
  - orc_money_per_kw
  - flash_money_per_kw
  - kalina_money_per_kw
  - temp_turbine_out_ORC
  - temp_turbine_out_Flash
  - temp_turbine_out_Kalina
  - include_egs
  - SED_NAN_POLICY
  - min_dt
  - well_spacing
  - flowrate_egs
  - flowrate_conventional

# Sensitivity ranges.
# For numeric parameters: max_dev_pct is the maximum deviation in percent from
# the base value (symmetric), steps is the number of steps on each side.
# Example: max_dev_pct=50, steps=2 → −50 %, −25 %, +25 %, +50 %.
# For boolean/categorical parameters, the value is ignored (use default value as a placeholder);
# all alternative values are automatically explored.
sensitivity_parameters:
  # --- Reservoir & drilling ---
  max_depth:
    absolute_values: [3000, 4000, 5000, 7000, 8000, 9000]  # override percentage-based deviations with absolute values (m)
  EGS_cutoff:
    absolute_values: [2000, 2500, 3500, 4000, 5000]  # override percentage-based deviations with absolute values (m)
  well_cost_sens:
    max_dev_pct: 50
    steps: 5
  stimulation_cost_per_doublet:
    max_dev_pct: 50
    steps: 5
  well_spacing:
    max_dev_pct: 50
    steps: 5
  flowrate_egs:
    max_dev_pct: 50
    steps: 5
  flowrate_conventional:
    max_dev_pct: 50
    steps: 5

  # --- Plant economics ---
  pump_cost:
    max_dev_pct: 50
    steps: 5
  lifetime:
    max_dev_pct: 50
    steps: 5
  capacity_factor:
    max_dev_pct: 50
    steps: 5
  fixed_OM_rate:
    max_dev_pct: 50
    steps: 5
  parasitic_fraction:
    max_dev_pct: 50
    steps: 5
  orc_money_per_kw:
    max_dev_pct: 50
    steps: 5
  flash_money_per_kw:
    max_dev_pct: 50
    steps: 5
  kalina_money_per_kw:
    max_dev_pct: 50
    steps: 5
  # --- Turbine outlet temperatures ---
  temp_turbine_out_ORC:
    max_dev_pct: 50
    steps: 5
  temp_turbine_out_Flash:
    max_dev_pct: 50
    steps: 5
  temp_turbine_out_Kalina:
    max_dev_pct: 50
    steps: 5
  # --- Minimum temperature difference ---
  min_dt:
    max_dev_pct: 50
    steps: 5
  # --- Boolean (flips the base value) ---
  include_egs: true

  # --- Categorical (multiple values explored) ---
  SED_NAN_POLICY: always_egs

# -----------------------------------------------------------------------------
# Quality-control options
# -----------------------------------------------------------------------------
qc_stride: 1              # increase to subsample QC sliders and reduce HTML file size
