[workspace]
name = "module_geothermal"
authors = ["See AUTHORS file"]
description = "This module calculates geothermal electricity production and costs based on a temperature model by Limberger et al. (2014)."
license = "Apache-2.0"
readme = "README.md"
channels = ["conda-forge", "bioconda"]
platforms = ["win-64", "linux-64", "osx-arm64"]
homepage = "https://www.modelblocks.org/"

[dependencies]
clio-tools = ">=2026.03.30"
conda = ">=25.0.0"
ipdb = ">=0.13.13"
ipykernel = ">=6.29.5"
jsonschema = ">=4.0.0"
mypy = ">=1.15.0"
pytest = ">=8.3.5"
python = ">=3.12"
ruff = ">=0.9.9"
snakefmt = ">=0.10.2"
snakemake-minimal = ">=9.19.0,<10"
rasterio = ">=1.5.0,<2"
xarray = ">=2026.1.0,<2027"
scipy = ">=1.17.0,<2"
geopandas = ">=1.1.2,<2"
pyarrow = ">=23.0.0,<24"
pandas = ">=2.3.0,<3"
pandera-geopandas = ">=0.24.0,<0.25"
dask = ">=2026.1.1,<2027"
rioxarray = ">=0.21.0,<0.22"
affine = ">=2.4.0,<3"
matplotlib = ">=3.10.8,<4"
cycler = ">=0.12.1,<0.13"
curl = ">=8.21.0,<9"
gregor = ">=0.1,<0.2"
netcdf4 = ">=1.7.2,<2"
numpy = ">=2.3,<3"
seaborn = ">=0.13,<0.14"

[tasks]
test-integration = {cmd = "pytest tests/integration_test.py"}
test-quick = {cmd = "pytest -m 'not workflow and not slow' tests"}
